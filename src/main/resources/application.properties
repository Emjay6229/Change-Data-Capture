spring.application.name=cdc
server.port=8081

# --- Datasource (matches docker-compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/orders
spring.datasource.username=orders_app
spring.datasource.password=orders_app

# --- JPA: Flyway owns the schema; Hibernate only checks it matches ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka (matches docker-compose.yaml, added in Phase 1) ---
spring.kafka.bootstrap-servers=localhost:9092

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
